name: Automated Firmware Compiler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout local repository files
      uses: actions/checkout@v4

    - name: Set up Python runtime environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO Framework Core
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Execute Firmware Compilation Pipeline
      run: pio run

    - name: Upload Flashable Firmware Binary Files
      uses: actions/upload-artifact@v4
      with:
        name: esp32-compiled-binaries
        path: .pio/build/esp32dev/firmware.bin
